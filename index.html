<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Approval</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="bar">
    <button id="menu" aria-label="Réglages">☰</button>
    <span id="title">Approval</span>
    <span id="progress"></span>
    <button id="mode" aria-label="Changer de mode">≡</button>
  </header>

  <!-- Écran partagé : l'image en haut, le panneau noir en bas. -->
  <main id="split">
    <section id="top">
      <div id="frame">
        <img id="image" alt="Image à valider" draggable="false">
        <div id="overlay"></div>
        <video id="clip" muted loop playsinline hidden></video>
        <button id="trash" type="button" aria-label="Glisser un point ici pour l'effacer" hidden>🗑</button>
      </div>
      <div id="reason"></div>
      <div id="picks">
        <button id="context" hidden>▶ Contexte</button>
      </div>
    </section>
    <section id="panel">
      <div id="result"><div id="answer"></div><div id="answerNote" class="small"></div></div>
      <div id="verdicts" class="verdicts"></div>
    </section>
    <section id="fix" hidden>
      <div id="value" aria-label="Valeur corrigée"></div>
      <div id="fixHint" class="small"></div>
      <div id="keypad"></div>
      <div id="fixButtons">
        <button id="fixCancel" type="button">Retour</button>
        <button id="fixOk" type="button">Valider</button>
      </div>
    </section>
  </main>

  <!-- Liste : chaque carte a ses boutons de jugement ; glissée à droite, elle s'ouvre dans l'écran partagé. -->
  <main id="list" hidden></main>

  <div id="done" hidden>
    <button id="doneClose" type="button" aria-label="Fermer">✕</button>
    <p id="doneText"></p>
    <button id="send">Envoyer les jugements</button>
  </div>

  <dialog id="settings">
    <form method="dialog">
      <h2>Réglages</h2>
      <label>Dépôt des modèles <input id="repo" placeholder="trackplayhi/trackplay-models"></label>
      <label>Jeton GitHub <input id="token" type="password" placeholder="github_pat_…"></label>
      <p class="small">Jeton « fine-grained » limité à ce dépôt, droit <b>Contents : read and write</b>. Il reste sur ce téléphone.</p>
      <label>File <select id="queue"></select></label>
      <p id="status" class="small"></p>
      <div class="row">
        <button id="clearOk" type="button">Effacer les justes</button>
        <button id="clearAll" type="button">Tout effacer</button>
      </div>
      <div class="row">
        <button id="demo" type="button">Exemple</button>
        <button id="demoBall" type="button">Exemple ballon</button>
        <button id="load" type="button">Charger</button>
        <button value="close">Fermer</button>
      </div>
    </form>
  </dialog>

  <div id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
